<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Chat Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --zalo-blue: #0068ff;
            --zalo-light-blue: #e5efff;
            --bg-gray: #f4f5f7;
            --bg-card: #ffffff;
            --border-color: #e0e0e0;
            --text-main: #081c36;
            --text-sub: #7589a3;
            --online-color: #46b450;
        }

        body.dark-theme {
            --bg-gray: #121212;
            --bg-card: #1e1e1e;
            --border-color: #2c2c2c;
            --text-main: #e4e6eb;
            --text-sub: #aaaaaa;
            --zalo-light-blue: #1a2a3a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gray); height: 100vh; overflow: hidden; color: var(--text-main); }

        .auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .auth-card { background: var(--bg-card); padding: 25px; border-radius: 16px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .auth-card input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-gray); color: var(--text-main); outline: none; font-size: 15px; }
        .auth-card button { width: 100%; padding: 12px; background: var(--zalo-blue); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

        .app-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; background: var(--bg-card); position: relative; }

        .mobile-header { height: 38px; background: var(--zalo-blue); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; flex-shrink: 0; }
        .mobile-header-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .mobile-header-actions { display: flex; gap: 12px; font-size: 15px; }

        .top-nav { height: 36px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; flex-shrink: 0; }
        .nav-tab { display: flex; align-items: center; gap: 5px; color: var(--text-sub); font-size: 12px; font-weight: 500; cursor: pointer; position: relative; padding: 5px 10px; border-bottom: 2px solid transparent; }
        .nav-tab i { font-size: 14px; }
        .nav-tab.active { color: var(--zalo-blue); font-weight: bold; border-bottom-color: var(--zalo-blue); }
        .badge { position: absolute; top: 1px; right: -2px; background: red; color: white; font-size: 8px; border-radius: 50%; padding: 1px 4px; }

        .screen-container { flex: 1; position: relative; overflow: hidden; }
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg-card); }
        .screen.active { display: flex; }

        .search-bar { padding: 6px 10px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); }
        .search-box { background: var(--bg-gray); border-radius: 16px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
        .search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 12px; color: var(--text-main); }
        
        .section-header { padding: 6px 10px 3px; font-size: 10px; font-weight: bold; color: var(--text-sub); text-transform: uppercase; background: var(--bg-gray); border-bottom: 1px solid var(--border-color); }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 8px 10px; gap: 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .chat-item:active, .chat-item.active { background: var(--zalo-light-blue); }
        
        .avatar-box { position: relative; }
        .avatar-box img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .status-dot { position: absolute; bottom: 1px; right: 1px; width: 9px; height: 9px; background: #ccc; border: 2px solid var(--bg-card); border-radius: 50%; }
        .status-dot.online { background: var(--online-color); }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-info h4 { font-size: 13px; color: var(--text-main); margin-bottom: 1px; }
        .chat-info p { font-size: 11px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-sm { padding: 4px 8px; border: 1px solid var(--zalo-blue); color: var(--zalo-blue); background: transparent; border-radius: 5px; font-size: 11px; font-weight: 500; }
        .btn-friend-tag { padding: 2px 5px; font-size: 10px; color: var(--online-color); border: 1px solid var(--online-color); border-radius: 4px; background: rgba(70,180,80,0.1); }

        .chat-view { position: absolute; inset: 0; background: var(--bg-gray); z-index: 100; display: none; flex-direction: column; height: 100vh; }
        .chat-view.active { display: flex; }
        
        .chat-header { height: 38px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 8px; justify-content: space-between; flex-shrink: 0; }
        .btn-back { font-size: 16px; color: var(--zalo-blue); padding: 4px 6px 4px 0; cursor: pointer; }

        .chat-messages { flex: 1; padding: 8px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .msg-row { display: flex; gap: 6px; max-width: 88%; align-items: flex-start; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-top: 2px; }

        .msg-content { background: var(--bg-card); color: var(--text-main); padding: 6px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); position: relative; min-width: 80px; }
        .msg-row.me .msg-content { background: var(--zalo-blue); color: #ffffff; }
        .msg-sender-name { font-size: 10px; font-weight: 500; color: var(--text-sub); margin-bottom: 2px; }
        .msg-row.me .msg-sender-name { display: none; }
        .msg-text-body { font-size: 13px; line-height: 1.3; word-break: break-word; }
        .msg-time-stamp { font-size: 9px; color: var(--text-sub); text-align: right; margin-top: 2px; }
        .msg-row.me .msg-time-stamp { color: rgba(255,255,255,0.8); }

        .msg-img { max-width: 160px; border-radius: 6px; margin-top: 3px; }
        .file-card { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.06); padding: 5px 7px; border-radius: 6px; margin-top: 3px; }
        .file-card i { font-size: 18px; color: var(--zalo-blue); }

        .chat-input-area { background: var(--bg-card); border-top: 1px solid var(--border-color); padding: 4px 8px; display: flex; align-items: center; gap: 8px; position: relative; flex-shrink: 0; }
        .chat-input-area input[type="text"] { flex: 1; border: none; outline: none; font-size: 13px; padding: 5px; background: transparent; color: var(--text-main); }
        .chat-blocked-notice { flex: 1; text-align: center; color: var(--text-sub); font-size: 11px; font-style: italic; padding: 5px 0; }

        .sticker-box { position: absolute; bottom: 45px; left: 6px; right: 6px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; display: none; grid-template-columns: repeat(4, 1fr); gap: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 110; }
        .sticker-item { font-size: 26px; text-align: center; }

        /* GIAO DIỆN CUỘC GỌI VOICE VÀ CHIA SẺ MÀN HÌNH */
        .call-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.95); display: none; flex-direction: column; justify-content: space-between; align-items: center; z-index: 9999; color: white; padding: 40px 20px; }
        .call-user-info { display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 2; }
        .call-avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--zalo-blue); object-fit: cover; }
        
        .video-container { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #remoteVideo { width: 100%; height: 100%; object-fit: contain; }
        #localVideo { position: absolute; top: 15px; right: 15px; width: 100px; height: 140px; border-radius: 8px; border: 2px solid #fff; object-fit: cover; display: none; }

        .call-controls { display: flex; gap: 15px; z-index: 2; }
        .call-action-btn { width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; border: none; background: rgba(255,255,255,0.2); color: white; transition: 0.2s; }
        .call-action-btn.active { background: var(--zalo-blue); }
        .call-action-btn.end { background: #ef4444; }

        .view-panel { flex: 1; padding: 12px; overflow-y: auto; }
        .color-picker { display: flex; gap: 8px; margin-top: 8px; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        
        .avatar-upload-box { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .avatar-preview { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--zalo-blue); }
    </style>
</head>
<body>

<div id="authModal" class="auth-overlay">
    <div class="auth-card">
        <h3 style="margin-bottom:5px;">My Chat Mobile</h3>
        <p style="font-size:12px; color:var(--text-sub);">Nhập tên hiển thị để bắt đầu</p>
        <input type="text" id="authUsername" placeholder="Tên của bạn..." required>
        <button onclick="handleAuth()">Đăng Nhập</button>
    </div>
</div>

<!-- GIAO DIỆN CUỘC GỌI VOICE & SCREEN SHARE -->
<div id="callModal" class="call-overlay">
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-user-info" id="callUserInfo">
        <img id="callAvatar" src="" class="call-avatar">
        <h3 id="callName">Người dùng</h3>
        <p id="callTypeStatus" style="color:#aaa; font-size:12px;">Đang kết nối cuộc gọi thoại...</p>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <div class="call-controls">
        <button class="call-action-btn" id="toggleMicBtn" onclick="toggleMuteMic()" title="Bật/Tắt Mic">
            <i class="fa-solid fa-microphone"></i>
        </button>
        <button class="call-action-btn" id="shareScreenBtn" onclick="toggleScreenShare()" title="Chia sẻ màn hình">
            <i class="fa-solid fa-desktop"></i>
        </button>
        <button class="call-action-btn end" onclick="endCall()" title="Tắt máy">
            <i class="fa-solid fa-phone-slash"></i>
        </button>
    </div>
</div>

<div class="app-container">
    <div class="mobile-header">
        <div class="mobile-header-title">
            <i class="fa-solid fa-paper-plane"></i> My Chat
        </div>
        <div class="mobile-header-actions">
            <i class="fa-solid fa-users-plus" onclick="promptCreateGroup()" title="Tạo nhóm"></i>
        </div>
    </div>

    <div class="top-nav">
        <div class="nav-tab active" id="tab-chats" onclick="switchMobileTab('chats')">
            <i class="fa-regular fa-comment-dots"></i>
            <span>Tin nhắn</span>
        </div>
        <div class="nav-tab" id="tab-friends" onclick="switchMobileTab('friends')">
            <i class="fa-solid fa-user-group"></i>
            <span id="friendReqBadge" class="badge" style="display:none;">0</span>
            <span>Danh bạ</span>
        </div>
        <div class="nav-tab" id="tab-settings" onclick="switchMobileTab('settings')">
            <i class="fa-solid fa-gear"></i>
            <span>Cài đặt</span>
        </div>
    </div>

    <div class="screen-container">
        <div class="screen active" id="chatsScreen">
            <div class="search-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color:var(--text-sub);"></i>
                    <input type="text" placeholder="Tìm người dùng hoặc nhóm..." oninput="handleSearch(this.value)">
                </div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="screen" id="friendsScreen">
            <div class="view-panel">
                <h3 style="margin-bottom:10px; font-size:15px;">Lời Mời Kết Bạn</h3>
                <div id="friendRequestsList">
                    <p style="color:var(--text-sub); font-size:12px;">Không có lời mời nào mới.</p>
                </div>
            </div>
        </div>

        <div class="screen" id="settingsScreen">
            <div class="view-panel">
                <div style="margin-bottom:12px; border-bottom:1px solid var(--border-color); padding-bottom:10px;">
                    <h3 style="margin-bottom:6px; font-size:15px;">Ảnh Đại Diện Cá Nhân</h3>
                    <div class="avatar-upload-box">
                        <img id="myAvatarPreview" src="https://via.placeholder.com/50" class="avatar-preview">
                        <label for="userAvatarInput" class="btn-sm" style="cursor:pointer;">
                            <i class="fa-solid fa-upload"></i> Đổi ảnh mới
                        </label>
                        <input type="file" id="userAvatarInput" accept="image/*" style="display:none;" onchange="updateUserAvatar(this)">
                    </div>
                </div>

                <h3 style="margin-bottom:10px; font-size:15px;">Cài Đặt</h3>
                <div style="margin-bottom: 12px;">
                    <button class="btn-sm" onclick="toggleDarkMode()"><i class="fa-solid fa-moon"></i> Bật/Tắt Dark Mode</button>
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="font-size:12px;"><input type="checkbox" id="notificationToggle" onchange="toggleNotificationPref(this.checked)"> Bật thông báo đẩy</label>
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="font-size:12px;">Màu chủ đạo:</label>
                    <div class="color-picker">
                        <div class="color-dot" style="background:#0068ff;" onclick="changeThemeColor('#0068ff', '#e5efff')"></div>
                        <div class="color-dot" style="background:#8b5cf6;" onclick="changeThemeColor('#8b5cf6', '#f3e8ff')"></div>
                        <div class="color-dot" style="background:#f97316;" onclick="changeThemeColor('#f97316', '#ffedd5')"></div>
                        <div class="color-dot" style="background:#10b981;" onclick="changeThemeColor('#10b981', '#d1fae5')"></div>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:6px; margin-top:12px;">
                    <button class="btn-sm" style="border-color:#7589a3; color:var(--text-main);" onclick="logout()">Đăng xuất</button>
                    <button class="btn-sm" style="border-color:red; color:red; background:rgba(255,0,0,0.05);" onclick="deleteAccount()"><i class="fa-solid fa-trash"></i> Xóa tài khoản vĩnh viễn</button>
                </div>
            </div>
        </div>

        <div class="chat-view" id="chatView">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:6px;">
                    <i class="fa-solid fa-chevron-left btn-back" onclick="closeChatView()"></i>
                    <img id="activeChatAvatar" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover;">
                    <div>
                        <h4 id="activeChatName" style="font-size:13px;">Name</h4>
                        <span id="activeStatusText" style="font-size:9px; color:var(--text-sub);">Trực tuyến</span>
                    </div>
                </div>
                <div style="display:flex; gap:12px; color:var(--zalo-blue); font-size:15px; align-items:center;">
                    <i id="inviteMemberBtn" class="fa-solid fa-user-plus" style="display:none;" onclick="inviteMemberToGroup()"></i>
                    <label id="changeGroupAvatarBtn" for="groupAvatarInput" style="display:none; cursor:pointer;"><i class="fa-solid fa-camera"></i></label>
                    <input type="file" id="groupAvatarInput" accept="image/*" style="display:none" onchange="updateGroupAvatar(this)">
                    
                    <!-- Nút gọi thoại (Voice Call) -->
                    <i class="fa-solid fa-phone" title="Gọi Voice" onclick="startVoiceCall()"></i>
                </div>
            </div>

            <div class="chat-messages" id="messageList"></div>

            <div class="chat-input-area" id="inputArea">
                <i class="fa-regular fa-face-smile" style="font-size:16px; color:var(--text-sub);" onclick="toggleStickerBox()"></i>
                <label for="imgInput"><i class="fa-regular fa-image" style="font-size:16px; color:var(--text-sub);"></i></label>
                <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendImage(this)">
                
                <label for="fileInput"><i class="fa-solid fa-paperclip" style="font-size:16px; color:var(--text-sub);"></i></label>
                <input type="file" id="fileInput" style="display:none" onchange="sendFile(this)">

                <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendTextMessage()">
                <i class="fa-solid fa-paper-plane" style="font-size:15px; color:var(--zalo-blue);" onclick="sendTextMessage()"></i>

                <div class="sticker-box" id="stickerBox">
                    <div class="sticker-item" onclick="sendSticker('❤️')">❤️</div>
                    <div class="sticker-item" onclick="sendSticker('😂')">😂</div>
                    <div class="sticker-item" onclick="sendSticker('🔥')">🔥</div>
                    <div class="sticker-item" onclick="sendSticker('🎉')">🎉</div>
                    <div class="sticker-item" onclick="sendSticker('👍')">👍</div>
                    <div class="sticker-item" onclick="sendSticker('😎')">😎</div>
                    <div class="sticker-item" onclick="sendSticker('😭')">😭</div>
                    <div class="sticker-item" onclick="sendSticker('🚀')">🚀</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, push, onValue, update, remove, get, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD9qpVwMj0dUk7RxifJMXbuTYNB87urGnM",
    authDomain: "blox-chat-2d8b9.firebaseapp.com",
    databaseURL: "https://blox-chat-2d8b9-default-rtdb.firebaseio.com",
    projectId: "blox-chat-2d8b9",
    storageBucket: "blox-chat-2d8b9.firebasestorage.app",
    messagingSenderId: "155627730633",
    appId: "1:155627730633:web:d7df899ed5fa1c16c5bf18"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentUser = JSON.parse(localStorage.getItem('mychat_user')) || null;
  let activeTarget = null;
  let myFriendsList = {};

  // BIẾN WEBRTC CHO VOICE CALL & SCREEN SHARE
  let peerConnection = null;
  let localStream = null;
  let screenStream = null;
  let isMuted = false;
  let isSharingScreen = false;
  const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

  window.addEventListener('load', () => {
    if (localStorage.getItem('mychat_dark') === 'true') document.body.classList.add('dark-theme');
    const savedColor = localStorage.getItem('mychat_color');
    const savedLightColor = localStorage.getItem('mychat_color_light');
    if (savedColor && savedLightColor) changeThemeColor(savedColor, savedLightColor, false);

    if (currentUser) {
      document.getElementById('authModal').style.display = 'none';
      initUserSession();
    }
  });

  window.handleAuth = function() {
    const name = document.getElementById('authUsername').value.trim();
    if (!name) return;
    const userId = 'user_' + Math.random().toString(36).substr(2, 9);
    currentUser = { id: userId, name: name, avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name}` };
    localStorage.setItem('mychat_user', JSON.stringify(currentUser));
    document.getElementById('authModal').style.display = 'none';
    initUserSession();
  };

  function initUserSession() {
    update(ref(db, 'users/' + currentUser.id), { id: currentUser.id, name: currentUser.name, avatar: currentUser.avatar, online: true });
    onDisconnect(ref(db, 'users/' + currentUser.id + '/online')).set(false);
    
    document.getElementById('myAvatarPreview').src = currentUser.avatar;
    listenMyFriends();
    loadSidebarData();
    listenFriendRequests();
    listenIncomingCalls();
  }

  // LẮNG NGHE CUỘC GỌI ĐẾN
  function listenIncomingCalls() {
    onValue(ref(db, `calls/${currentUser.id}`), (snap) => {
      const callData = snap.val();
      if (callData && callData.status === 'offer') {
        if (confirm(`${callData.fromName} đang gọi thoại cho bạn. Bạn có muốn nghe không?`)) {
          answerVoiceCall(callData);
        } else {
          set(ref(db, `calls/${currentUser.id}`), null);
        }
      }
    });
  }

  // BẮT ĐẦU GỌI THOẠI (VOICE CALL)
  window.startVoiceCall = async function() {
    if (!activeTarget) return;
    setupCallUI(activeTarget.name, activeTarget.avatar, "Đang gọi thoại...");

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      createPeerConnection(activeTarget.id);

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      set(ref(db, `calls/${activeTarget.id}`), {
        from: currentUser.id,
        fromName: currentUser.name,
        fromAvatar: currentUser.avatar,
        targetId: activeTarget.id,
        offer: { type: offer.type, sdp: offer.sdp },
        status: 'offer'
      });

      listenCallAnswer(activeTarget.id);
    } catch (err) {
      alert("Không thể truy cập Microphone: " + err.message);
      endCall();
    }
  };

  // TRẢ LỜI CUỘC GỌI
  async function answerVoiceCall(callData) {
    setupCallUI(callData.fromName, callData.fromAvatar, "Đã kết nối cuộc gọi thoại");

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      createPeerConnection(callData.from);

      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      update(ref(db, `calls/${currentUser.id}`), {
        answer: { type: answer.type, sdp: answer.sdp },
        status: 'answered'
      });

      listenIceCandidates(callData.from);
    } catch (err) {
      alert("Lỗi khi kết nối cuộc gọi: " + err.message);
      endCall();
    }
  }

  function listenCallAnswer(targetId) {
    onValue(ref(db, `calls/${targetId}`), async (snap) => {
      const data = snap.val();
      if (data && data.status === 'answered' && data.answer) {
        if (!peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
          document.getElementById('callTypeStatus').innerText = "Đã kết nối cuộc gọi thoại";
          listenIceCandidates(targetId);
        }
      }
    });
  }

  function createPeerConnection(targetId) {
    peerConnection = new RTCPeerConnection(rtcConfig);

    peerConnection.onicecandidate = (e) => {
      if (e.candidate) {
        push(ref(db, `candidates/${targetId}`), JSON.parse(JSON.stringify(e.candidate)));
      }
    };

    peerConnection.ontrack = (e) => {
      const remoteAudio = document.getElementById('remoteAudio');
      const remoteVideo = document.getElementById('remoteVideo');

      if (e.track.kind === 'audio') {
        remoteAudio.srcObject = e.streams[0];
      } else if (e.track.kind === 'video') {
        remoteVideo.srcObject = e.streams[0];
        document.getElementById('callUserInfo').style.display = 'none';
      }
    };
  }

  function listenIceCandidates(targetId) {
    onValue(ref(db, `candidates/${currentUser.id}`), (snap) => {
      const candidates = snap.val() || {};
      Object.values(candidates).forEach(candidate => {
        peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      });
    });
  }

  // TÍNH NĂNG CHIA SẺ MÀN HÌNH (SCREEN SHARE)
  window.toggleScreenShare = async function() {
    if (!peerConnection) return alert("Bạn phải tham gia cuộc gọi trước!");

    if (!isSharingScreen) {
      try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const videoTrack = screenStream.getVideoTracks()[0];

        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          sender.replaceTrack(videoTrack);
        } else {
          peerConnection.addTrack(videoTrack, screenStream);
        }

        const localVideo = document.getElementById('localVideo');
        localVideo.srcObject = screenStream;
        localVideo.style.display = 'block';

        document.getElementById('shareScreenBtn').classList.add('active');
        isSharingScreen = true;

        videoTrack.onended = () => stopScreenShare();
      } catch (err) {
        console.error("Lỗi chia sẻ màn hình:", err);
      }
    } else {
      stopScreenShare();
    }
  };

  function stopScreenShare() {
    if (screenStream) {
      screenStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById('localVideo').style.display = 'none';
    document.getElementById('shareScreenBtn').classList.remove('active');
    document.getElementById('callUserInfo').style.display = 'flex';
    isSharingScreen = false;
  }

  window.toggleMuteMic = function() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      isMuted = !isMuted;
      audioTrack.enabled = !isMuted;
      document.getElementById('toggleMicBtn').classList.toggle('active', isMuted);
    }
  };

  function setupCallUI(name, avatar, status) {
    document.getElementById('callName').innerText = name;
    document.getElementById('callAvatar').src = avatar;
    document.getElementById('callTypeStatus').innerText = status;
    document.getElementById('callModal').style.display = 'flex';
    document.getElementById('callUserInfo').style.display = 'flex';
  }

  window.endCall = function() {
    if (peerConnection) peerConnection.close();
    if (localStream) localStream.getTracks().forEach(track => track.stop());
    if (screenStream) screenStream.getTracks().forEach(track => track.stop());

    if (currentUser) remove(ref(db, `calls/${currentUser.id}`));
    if (activeTarget) remove(ref(db, `calls/${activeTarget.id}`));

    document.getElementById('callModal').style.display = 'none';
    document.getElementById('localVideo').style.display = 'none';
    document.getElementById('shareScreenBtn').classList.remove('active');
    peerConnection = null;
    localStream = null;
    screenStream = null;
    isSharingScreen = false;
  };

  function listenMyFriends() {
    onValue(ref(db, `friends/${currentUser.id}`), (snap) => {
      myFriendsList = snap.val() || {};
      loadSidebarData();
    });
  }

  window.inviteMemberToGroup = function() {
    if (!activeTarget || activeTarget.type !== 'group') return;

    const friendIds = Object.keys(myFriendsList);
    if (friendIds.length === 0) return alert("Bạn chưa có bạn bè nào để mời!");

    get(ref(db, 'users')).then((snap) => {
      const allUsers = snap.val() || {};
      let friendNamesList = "Mời bạn bè vào nhóm:\n";
      const availableFriends = [];

      friendIds.forEach((fId) => {
        if (allUsers[fId]) {
          availableFriends.push(allUsers[fId]);
          friendNamesList += `${availableFriends.length}. ${allUsers[fId].name}\n`;
        }
      });

      const choice = prompt(friendNamesList + "\nNhập SỐ THỨ TỰ người bạn chọn:");
      const chosenIndex = parseInt(choice) - 1;

      if (!isNaN(chosenIndex) && availableFriends[chosenIndex]) {
        const invitedUser = availableFriends[chosenIndex];
        set(ref(db, `groups/${activeTarget.id}/members/${invitedUser.id}`), true)
          .then(() => alert(`Đã thêm ${invitedUser.name} vào nhóm!`));
      }
    });
  };

  window.deleteAccount = function() {
    if (!currentUser) return;
    const confirmDelete = confirm("CẢNH BÁO: Bạn có chắc chắn muốn XÓA VĨNH VIỄN tài khoản này không?");
    if (!confirmDelete) return;

    remove(ref(db, 'users/' + currentUser.id))
      .then(() => {
        remove(ref(db, 'friend_requests/' + currentUser.id));
        remove(ref(db, 'friends/' + currentUser.id));
        localStorage.clear();
        alert("Đã xóa tài khoản thành công!");
        location.reload();
      });
  };

  window.updateUserAvatar = function(fileInput) {
    const file = fileInput.files[0];
    if (!file || !currentUser) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const newAvatarUrl = e.target.result;
      currentUser.avatar = newAvatarUrl;
      localStorage.setItem('mychat_user', JSON.stringify(currentUser));

      update(ref(db, 'users/' + currentUser.id), { avatar: newAvatarUrl }).then(() => {
        document.getElementById('myAvatarPreview').src = newAvatarUrl;
        alert("Đã cập nhật ảnh đại diện cá nhân!");
      });
    };
    reader.readAsDataURL(file);
  };

  window.updateGroupAvatar = function(fileInput) {
    const file = fileInput.files[0];
    if (!file || !activeTarget || activeTarget.type !== 'group') return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const newAvatarUrl = e.target.result;
      update(ref(db, 'groups/' + activeTarget.id), { avatar: newAvatarUrl }).then(() => {
        activeTarget.avatar = newAvatarUrl;
        document.getElementById('activeChatAvatar').src = newAvatarUrl;
        alert("Đã cập nhật ảnh đại diện nhóm!");
      });
    };
    reader.readAsDataURL(file);
  };

  window.switchMobileTab = function(tab) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

    document.getElementById(`tab-${tab}`).classList.add('active');
    document.getElementById(`${tab}Screen`).classList.add('active');
  };

  window.closeChatView = function() {
    document.getElementById('chatView').classList.remove('active');
    activeTarget = null;
  };

  window.toggleDarkMode = function() {
    const isDark = document.body.classList.toggle('dark-theme');
    localStorage.setItem('mychat_dark', isDark);
  };

  window.changeThemeColor = function(primary, light, save = true) {
    document.documentElement.style.setProperty('--zalo-blue', primary);
    document.documentElement.style.setProperty('--zalo-light-blue', light);
    if (save) {
      localStorage.setItem('mychat_color', primary);
      localStorage.setItem('mychat_color_light', light);
    }
  };

  window.toggleNotificationPref = function(enabled) {
    localStorage.setItem('mychat_notif', enabled);
    if (enabled && "Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }
  };

  window.promptCreateGroup = function() {
    if (!currentUser) return alert("Vui lòng đăng nhập trước!");
    const groupName = prompt("Nhập tên nhóm chat mới:");
    if (!groupName || groupName.trim() === "") return;

    const groupId = 'group_' + Math.random().toString(36).substr(2, 9);
    set(ref(db, 'groups/' + groupId), {
      id: groupId,
      name: groupName.trim(),
      avatar: `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(groupName)}`,
      members: { [currentUser.id]: true }
    }).then(() => alert("Đã tạo nhóm thành công!"));
  };

  function loadSidebarData(query = "") {
    onValue(ref(db, 'users'), (snap) => {
      const users = snap.val() || {};
      onValue(ref(db, 'groups'), (groupSnap) => {
        const groups = groupSnap.val() || {};
        renderSidebarList(users, groups, query.toLowerCase());
      });
    });
  }

  function renderSidebarList(users, groups, query) {
    const chatList = document.getElementById('chatList');
    chatList.innerHTML = '';

    Object.values(groups).forEach(g => {
      if (g.name.toLowerCase().includes(query) && g.members && g.members[currentUser.id]) {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.innerHTML = `
          <div class="avatar-box"><img src="${g.avatar}"></div>
          <div class="chat-info"><h4>${g.name} (Nhóm)</h4><p>Nhấp để trò chuyện</p></div>
        `;
        div.onclick = () => selectTarget({ id: g.id, type: 'group', name: g.name, avatar: g.avatar });
        chatList.appendChild(div);
      }
    });

    const sortedUsers = Object.values(users)
      .filter(u => u.id !== currentUser.id && u.name.toLowerCase().includes(query))
      .sort((a, b) => a.name.localeCompare(b.name, 'vi', { sensitivity: 'base' }));

    if (sortedUsers.length > 0) {
      const sectionHeader = document.createElement('div');
      sectionHeader.className = 'section-header';
      sectionHeader.innerText = 'Các tài khoản bạn có thể biết';
      chatList.appendChild(sectionHeader);

      sortedUsers.forEach(u => {
        const isFriend = !!myFriendsList[u.id];
        const div = document.createElement('div');
        div.className = 'chat-item';

        let actionBtnHtml = isFriend 
          ? `<span class="btn-friend-tag"><i class="fa-solid fa-check"></i> Bạn bè</span>`
          : `<button class="btn-sm" onclick="sendFriendRequest('${u.id}', event)">Kết bạn</button>`;

        div.innerHTML = `
          <div class="avatar-box"><img src="${u.avatar}"><div class="status-dot ${u.online ? 'online' : ''}"></div></div>
          <div class="chat-info"><h4>${u.name}</h4><p>${u.online ? 'Đang hoạt động' : 'Ngoại tuyến'}</p></div>
          ${actionBtnHtml}
        `;
        div.onclick = () => selectTarget({ id: u.id, type: 'user', name: u.name, avatar: u.avatar, online: u.online, isFriend: isFriend });
        chatList.appendChild(div);
      });
    }
  }

  window.sendFriendRequest = function(targetId, e) {
    e.stopPropagation();
    set(ref(db, `friend_requests/${targetId}/${currentUser.id}`), {
      fromId: currentUser.id,
      fromName: currentUser.name,
      fromAvatar: currentUser.avatar
    });
    alert("Đã gửi lời mời kết bạn!");
  };

  function listenFriendRequests() {
    onValue(ref(db, `friend_requests/${currentUser.id}`), (snap) => {
      const reqs = snap.val() || {};
      const list = document.getElementById('friendRequestsList');
      const badge = document.getElementById('friendReqBadge');
      const count = Object.keys(reqs).length;
      
      badge.style.display = count > 0 ? 'inline' : 'none';
      badge.innerText = count;

      if (count === 0) {
        list.innerHTML = `<p style="color:var(--text-sub); font-size:12px;">Không có lời mời nào mới.</p>`;
        return;
      }

      list.innerHTML = '';
      Object.values(reqs).forEach(r => {
        const div = document.createElement('div');
        div.style.cssText = "display:flex; align-items:center; gap:8px; margin-bottom:10px;";
        div.innerHTML = `
          <img src="${r.fromAvatar}" style="width:32px; height:32px; border-radius:50%;">
          <div style="flex:1; font-size:11px;"><b>${r.fromName}</b> gửi lời mời kết bạn.</div>
          <button class="btn-sm" onclick="acceptFriend('${r.fromId}')">Đồng ý</button>
        `;
        list.appendChild(div);
      });
    });
  }

  window.acceptFriend = function(fromId) {
    set(ref(db, `friends/${currentUser.id}/${fromId}`), true);
    set(ref(db, `friends/${fromId}/${currentUser.id}`), true);
    set(ref(db, `friend_requests/${currentUser.id}/${fromId}`), null);
    alert("Đã đồng ý kết bạn!");
  };

  function selectTarget(target) {
    activeTarget = target;
    document.getElementById('chatView').classList.add('active');
    document.getElementById('activeChatName').innerText = target.name;
    document.getElementById('activeChatAvatar').src = target.avatar;

    document.getElementById('changeGroupAvatarBtn').style.display = target.type === 'group' ? 'inline-block' : 'none';
    document.getElementById('inviteMemberBtn').style.display = target.type === 'group' ? 'inline-block' : 'none';

    const inputArea = document.getElementById('inputArea');
    if (target.type === 'user' && !target.isFriend) {
      inputArea.innerHTML = `<div class="chat-blocked-notice"><i class="fa-solid fa-lock"></i> Bạn cần kết bạn với ${target.name} để nhắn tin.</div>`;
    } else {
      inputArea.innerHTML = `
        <i class="fa-regular fa-face-smile" style="font-size:16px; color:var(--text-sub);" onclick="toggleStickerBox()"></i>
        <label for="imgInput"><i class="fa-regular fa-image" style="font-size:16px; color:var(--text-sub);"></i></label>
        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendImage(this)">
        <label for="fileInput"><i class="fa-solid fa-paperclip" style="font-size:16px; color:var(--text-sub);"></i></label>
        <input type="file" id="fileInput" style="display:none" onchange="sendFile(this)">
        <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendTextMessage()">
        <i class="fa-solid fa-paper-plane" style="font-size:15px; color:var(--zalo-blue);" onclick="sendTextMessage()"></i>
        <div class="sticker-box" id="stickerBox">
            <div class="sticker-item" onclick="sendSticker('❤️')">❤️</div>
            <div class="sticker-item" onclick="sendSticker('😂')">😂</div>
            <div class="sticker-item" onclick="sendSticker('🔥')">🔥</div>
            <div class="sticker-item" onclick="sendSticker('🎉')">🎉</div>
            <div class="sticker-item" onclick="sendSticker('👍')">👍</div>
            <div class="sticker-item" onclick="sendSticker('😎')">😎</div>
            <div class="sticker-item" onclick="sendSticker('😭')">😭</div>
            <div class="sticker-item" onclick="sendSticker('🚀')">🚀</div>
        </div>
      `;
    }

    loadMessages();
  }

  function getRoomPath() {
    if (!activeTarget) return null;
    if (activeTarget.type === 'group') return 'rooms/' + activeTarget.id;
    const ids = [currentUser.id, activeTarget.id].sort();
    return 'rooms/' + ids[0] + '_' + ids[1];
  }

  function loadMessages() {
    const roomPath = getRoomPath();
    if (!roomPath) return;

    onValue(ref(db, roomPath + '/messages'), (snapshot) => {
      const msgs = snapshot.val() || {};
      const msgContainer = document.getElementById('messageList');
      msgContainer.innerHTML = '';

      Object.values(msgs).forEach(msg => {
        const isMe = msg.senderId === currentUser.id;
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'me' : ''}`;
        
        let avatarHtml = !isMe ? `<img src="${msg.senderAvatar || 'https://via.placeholder.com/26'}" class="msg-avatar">` : '';

        let content = `${avatarHtml}<div class="msg-content">`;
        
        if (!isMe && msg.senderName) {
          content += `<div class="msg-sender-name">${msg.senderName}</div>`;
        }

        content += `<div class="msg-text-body">`;
        if (msg.sticker) content += `<div style="font-size:32px;">${msg.sticker}</div>`;
        if (msg.text) content += `<div>${msg.text}</div>`;
        if (msg.image) content += `<img src="${msg.image}" class="msg-img">`;
        if (msg.file) {
          content += `
            <div class="file-card">
              <i class="fa-solid fa-file-zipper"></i>
              <div style="flex:1; overflow:hidden;">
                <div style="font-weight:bold; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${msg.file.name}</div>
              </div>
              <a href="${msg.file.data}" download="${msg.file.name}" style="color:var(--zalo-blue);"><i class="fa-solid fa-download"></i></a>
            </div>
          `;
        }
        content += `</div>`;

        const timeStr = msg.time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        content += `<div class="msg-time-stamp">${timeStr}</div></div>`;

        div.innerHTML = content;
        msgContainer.appendChild(div);
      });

      msgContainer.scrollTop = msgContainer.scrollHeight;
    });
  }

  function getCurrentTime() {
    const now = new Date();
    return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
  }

  window.sendTextMessage = function() {
    const input = document.getElementById('msgInput');
    if (!input || !input.value.trim() || !activeTarget) return;
    push(ref(db, `${getRoomPath()}/messages`), { 
      senderId: currentUser.id, 
      senderName: currentUser.name,
      senderAvatar: currentUser.avatar,
      text: input.value.trim(),
      time: getCurrentTime()
    });
    input.value = '';
  };

  window.sendImage = function(fileInput) {
    const file = fileInput.files[0];
    if (!file || !activeTarget) return;
    const reader = new FileReader();
    reader.onload = function(e) { 
      push(ref(db, `${getRoomPath()}/messages`), { 
        senderId: currentUser.id, 
        senderName: currentUser.name,
        senderAvatar: currentUser.avatar,
        image: e.target.result,
        time: getCurrentTime()
      }); 
    };
    reader.readAsDataURL(file);
  };

  window.sendFile = function(fileInput) {
    const file = fileInput.files[0];
    if (!file || !activeTarget) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      push(ref(db, `${getRoomPath()}/messages`), {
        senderId: currentUser.id,
        senderName: currentUser.name,
        senderAvatar: currentUser.avatar,
        file: { name: file.name, size: file.size, data: e.target.result },
        time: getCurrentTime()
      });
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  };

  window.toggleStickerBox = function() {
    const box = document.getElementById('stickerBox');
    box.style.display = box.style.display === 'grid' ? 'none' : 'grid';
  };

  window.sendSticker = function(emoji) {
    if (!activeTarget) return;
    push(ref(db, `${getRoomPath()}/messages`), { 
      senderId: currentUser.id, 
      senderName: currentUser.name,
      senderAvatar: currentUser.avatar,
      sticker: emoji,
      time: getCurrentTime()
    });
    document.getElementById('stickerBox').style.display = 'none';
  };

  window.logout = function() { localStorage.clear(); location.reload(); };
  window.handleSearch = function(val) { loadSidebarData(val); };
</script>
</body>
</html>
